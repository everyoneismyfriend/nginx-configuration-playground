worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  access_log /dev/null;
  error_log /dev/null;

  accounting on;
  accounting_interval 1;
  accounting_log /var/log/nginx/access.log notice;

  accounting_ignore_init_messages on;
  accounting_ignore_default_accounting_id_messages on;

  server {
    listen 80 default_server;
    server_name  _;

    location /default {
      return 200;
    }

    location /test {
      accounting_id "test";
      return 200;
    }
  }
}
