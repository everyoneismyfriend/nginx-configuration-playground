version: "3.9"

services:
  origin:
    image: "nginx:latest"
    volumes:
      - ./origin.conf:/etc/nginx/nginx.conf
      - ../media:/media
    hostname: "origin-4"
    ports:
      - "81:80"

  backend:
    image: "nginx:latest"
    volumes:
      - ./backend.conf:/etc/nginx/nginx.conf
    hostname: "backend-4"
    ports:
      - "82:80"

  storage:
    image: "nginx:latest"
    volumes:
      - ./storage.conf:/etc/nginx/nginx.conf
      - ../media:/media
    hostname: "storage-4"
    ports:
      - "83:80"

  storage_origin:
    image: "nginx:latest"
    volumes:
      - ./storage_origin.conf:/etc/nginx/nginx.conf
      - ../media:/media
    hostname: "storage-origin-4"
    ports:
      - "84:80"

  vod:
    build: .
    volumes:
      - ./vod.conf:/etc/nginx/nginx.conf
    hostname: "vod-4"
    ports:
      - "80:80"
