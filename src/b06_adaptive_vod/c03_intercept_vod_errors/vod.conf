worker_processes 1;

events {
  worker_connections 1024;
}

http {
  upstream origin {
    server origin-3;
  }

  upstream backend {
    server backend-3;
  }

  server {
    listen 80 default_server;
    server_name _;

    location /origin {
      internal;

      rewrite /origin/hls/(.*)$ /$1 break;
      proxy_pass http://origin;
    }

    location /hls {
      vod hls;
      vod_mode remote;
      vod_upstream_location /origin;

      proxy_intercept_errors on;
      error_page 404 502 = @backend;
    }

    location @backend {
      proxy_pass http://backend;
    }
  }
}
